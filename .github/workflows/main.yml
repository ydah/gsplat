name: Ruby

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --no-server

  ruby-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
        env:
          GSPLAT_BACKEND: ruby

  native-test:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enabled after P10-1 adds the native extension"

  e2e:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Enabled after P7-2 adds the fit-image test"

name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --no-server
      - name: Verify public API documentation
        run: bundle exec yard stats --list-undoc | tail -1 | grep -Fx " 100.00% documented"

  ruby-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
        env:
          GSPLAT_BACKEND: ruby

  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rake compile
      - run: bundle exec rake test
        env:
          GSPLAT_BACKEND: native
          OMP_NUM_THREADS: "2"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Run fitting, trainer, and example smoke tests
        run: >-
          bundle exec ruby -Itest test/training/image_fitter_test.rb &&
          bundle exec ruby -Itest test/training/trainer_test.rb &&
          bundle exec ruby -Itest test/examples_cli_test.rb
        env:
          GSPLAT_BACKEND: ruby
